<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
    <!-- Элемент скримера, изначально скрытый -->
    <img id="screamerImage" class="screamer-img" src="https://i.pinimg.com/736x/51/d9/60/51d960a7b3bbf378b446e7a196731135.jpg" alt="Screamer">
    
    <div class="widget-container">
        <div class="game-card">
            <!-- Header -->
            <div class="game-header">
                <h2 class="game-title">Secret Word Game</h2>
                <div class="lives-badge">
                    <svg class="heart-icon" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                    </svg>
                    <span id="livesText">6 / 6 Lives</span>
                </div>
            </div>

            <!-- Body: Gallows + Letter Slots -->
            <div class="game-body">
                <div class="hangman-viewport">
                    <svg class="hangman-svg" viewBox="0 0 100 120">
                        <line class="gallows-part" x1="10" y1="110" x2="90" y2="110" />
                        <line class="gallows-part" x1="30" y1="110" x2="30" y2="15" />
                        <line class="gallows-part" x1="30" y1="15" x2="70" y2="15" />
                        <line class="gallows-part" x1="70" y1="15" x2="70" y2="30" />

                        <circle id="part-1" class="hangman-part" cx="70" cy="40" r="10" />
                        <line id="part-2" class="hangman-part" x1="70" y1="50" x2="70" y2="75" />
                        <line id="part-3" class="hangman-part" x1="70" y1="55" x2="55" y2="68" />
                        <line id="part-4" class="hangman-part" x1="70" y1="55" x2="85" y2="68" />
                        <line id="part-5" class="hangman-part" x1="70" y1="75" x2="55" y2="95" />
                        <line id="part-6" class="hangman-part" x1="70" y1="75" x2="85" y2="95" />
                    </svg>
                </div>

                <div class="word-container" id="wordContainer"></div>
            </div>

            <p class="hint-subtext">Type on your keyboard or tap the keys below to guess</p>

            <!-- Virtual Keyboard -->
            <div class="keyboard-grid" id="keyboardGrid">
                <div class="keyboard-row" id="row1"></div>
                <div class="keyboard-row" id="row2"></div>
                <div class="keyboard-row" id="row3"></div>
            </div>

            <!-- Win / Loss Overlay -->
            <div class="end-overlay" id="endOverlay">
                <h3 class="end-status-title" id="endTitle">Молодец!</h3>
                <p class="end-word-reveal">
                    <span class="secret-word-highlight" id="endWord"></span>
                </p>
                <!-- <button class="play-again-btn" id="playAgainBtn">Play Again</button> -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
